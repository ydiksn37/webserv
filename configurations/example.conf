server {
	listen 8080;
	server_name localhost;
	client_max_body_size 10485760;
	error_page 404 /404.html;

	location / {
		root /var/www/html;
	}

	location /upload {
		upload_enable on;
		client_max_body_size 500000000;
		error_page 404 /upload_error.html;
	}
}

server {
	listen 0.0.0.0:8080;

	server_name localhost example.com www.example.com mytest.local;

	client_max_body_size 10485760;

	error_page 404 /var/www/html/error/404.html;
	error_page 500 502 503 504 /var/www/html/error/50x.html;

	location / {
		allow_methods GET;
		root /var/www/html;
		index index.html index.htm;
		autoindex on;
	}

	location /old-page {
		return 301 /new-page.html;
	}

	location /kapouet {
		allow_methods GET;
		alias /tmp/www;
	}

	location /upload {
		allow_methods GET POST DELETE;
		upload_enable on;
		upload_store /var/www/uploads;
	}

	location /cgi-bin {
		allow_methods GET POST;
		root /var/www/cgi-bin;
		cgi_extension .py .php;
		cgi_path .py /usr/bin/python3;
		cgi_path .php /usr/bin/php-cgi;
	}
}

server {
	listen 0.0.0.0:8080;
	server_name example.com;
	client_max_body_size 1024;
	location / {
		allow_methods GET;
		root /var/www/example;
		index index.html;
	}
}

server {
	listen 0.0.0.0:8081;
	server_name webserv.local;
	location / {
		allow_methods GET;
		root /var/www/port8081;
	}
}
